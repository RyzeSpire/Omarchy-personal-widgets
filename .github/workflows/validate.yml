name: Validate source bundle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -B scripts/validate.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s plugins/ryze.steam -p 'test_*.py' -v
      - run: python -B scripts/make-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-personal-widgets-source
          path: dist/
