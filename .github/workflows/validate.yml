name: Validate source bundle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -B scripts/validate.py
      - name: Install distribution GLib and Lua test runtimes
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-glib-2.0 lua5.4
      - name: Isolated package and keyring checks
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s plugins/ryze.steam -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_keyboard_layout.cjs
      - run: lua5.4 tests/test_steam_workspace.lua
      - run: python -B scripts/make-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-personal-widgets-source
          path: dist/
